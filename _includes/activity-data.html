{% comment %}
  작성 기록 데이터. 홈의 잔디(activity.js)와 날짜 페이지(activity-log.js)가 함께 쓴다.
  - post-data: 글 목록 {d: 날짜, t: 제목, u: 주소}
  - reading-data: 독서 기록 {"YYYY-MM-DD": [{title, blog}]}. private-notes 워크플로가 _data/reading_activity.json 을 갱신한다.
{% endcomment %}
<script id="post-data" type="application/json">[{% for post in site.posts %}{"d":{{ post.date | date: '%Y-%m-%d' | jsonify }},"t":{{ post.title | jsonify }},"u":{{ post.url | relative_url | jsonify }}}{% unless forloop.last %},{% endunless %}{% endfor %}]</script>
<script id="reading-data" type="application/json">{{ site.data.reading_activity | jsonify }}</script>

	<!-- FOUC 방지: 스타일시트 적용 전 data-theme 동기 설정 -->
	<script>
		(function () {
			try {
				var t = localStorage.getItem('theme');
				if (!t) { t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
				document.documentElement.setAttribute('data-theme', t);
			} catch (e) { }
		})();
	</script>
